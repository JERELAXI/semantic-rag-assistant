upstream backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Allow large uploads (must be >= MAX_FILE_SIZE_MB in .env)
    client_max_body_size 55m;

    # ── Webapp API calls (React app uses /api/ prefix; nginx strips it) ────
    location /api/ {
        proxy_pass         http://backend/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        # Required for SSE / streaming responses
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Direct backend routes (extension + other API clients) ──────────────
    # Matches /auth/*, /knowledge-bases/*, /documents/*, /organizations/*,
    #         /chat/*, /mcp/*, /health  — passes full URI unchanged.
    location ~ ^/(auth|knowledge-bases|documents|organizations|chat|mcp|health)(/|$) {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Static assets — long-lived cache for hashed filenames ─────────────
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff|woff2|ttf|eot)$ {
        root      /usr/share/nginx/html;
        expires   1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── React SPA — all unmatched paths serve index.html ──────────────────
    location / {
        root      /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
