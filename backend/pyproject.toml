[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.136.1",
    "httpx>=0.28.0",
    "langchain-text-splitters>=0.3.0",
    "mcp>=1.27.0",
    "openai>=1.82.0",
    "pgvector>=0.4.2",
    "pydantic-settings>=2.14.0",
    "pwdlib[argon2]>=0.2.1",
    "PyMuPDF>=1.25.0",
    "python-docx>=1.1.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.20",
    "ruff>=0.15.12",
    "sqlalchemy[asyncio]>=2.0.49",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
